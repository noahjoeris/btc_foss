  "Blockstream/Jade",
  "BlockstreamResearch/rust-simplicity",
  "Coldcard/firmware",
  "fanquake/core-review",
  "wizardsardine/async-hwi",
  "wizardsardine/bhwi",
]

keywords = ["bitcoin"]
exclude = []
